repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black --check
        language: python
        additional_dependencies: ["black==25.12.0"]
        types: [python]
        files: ^(src|tests)/.*\.py$
      - id: ruff
        name: ruff
        entry: ruff check
        language: python
        additional_dependencies: ["ruff==0.16.2"]
        types: [python]
        files: ^(src|tests)/.*\.py$
      - id: no-private-refs
        name: no private repo/path refs in docs
        entry: python scripts/check_no_private_refs.py
        language: system
        pass_filenames: false
        files: \.md$
