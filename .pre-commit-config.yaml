repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black --check
        language: python
        additional_dependencies: ["black==25.12.0"]
        types: [python]
        files: ^(src|tests)/.*\.py$
      - id: ruff
        name: ruff
        entry: ruff check
        language: python
        additional_dependencies: ["ruff==0.16.2"]
        types: [python]
        files: ^(src|tests)/.*\.py$
