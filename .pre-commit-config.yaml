repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black --check
        language: system
        types: [python]
        files: ^(src|tests)/.*\.py$
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
        files: ^(src|tests)/.*\.py$
